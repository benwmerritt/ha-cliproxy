name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -p no:homeassistant tests/addon
      - run: uv run pytest tests/integration

  addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./cliproxy
      - name: Build the add-on image
        run: docker build --tag cliproxy-addon ./cliproxy
      - name: Check the image's Python can import the add-on
        run: docker run --rm --entrypoint python3 cliproxy-addon -c "import sys; sys.path.insert(0, '/app'); import server, usage"
