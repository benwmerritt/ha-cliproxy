name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -p no:homeassistant tests/addon
      - run: uv run pytest tests/integration

  addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./cliproxy
      - name: Build the add-on image
        run: docker build --tag cliproxy-addon ./cliproxy
      - name: Start the add-on through its entrypoint and read its status API
        run: |
          mkdir data
          echo '{"url": "http://127.0.0.1:9", "management_key": "test"}' > data/options.json
          docker run --detach --name cliproxy --env SUPERVISOR_TOKEN=test --volume "$PWD/data:/data" --publish 8099:8099 cliproxy-addon
          for attempt in $(seq 30); do curl --silent --output /dev/null http://127.0.0.1:8099/ && break; sleep 1; done
          docker logs cliproxy
          test "$(docker inspect --format '{{.State.Running}}' cliproxy)" = true
          curl --silent --header "Authorization: Bearer $(sudo cat data/api-token)" http://127.0.0.1:8099/api/status | tee status.json
          grep --quiet '"error": "CLIProxy request failed' status.json
