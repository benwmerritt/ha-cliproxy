[project]
name = "ha-cliproxy"
version = "0.1.0"
requires-python = ">=3.13"

[dependency-groups]
dev = [
  "pytest-homeassistant-custom-component",
  "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", "tests", "cliproxy/rootfs/app"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components", "sample", "server", "usage"]
